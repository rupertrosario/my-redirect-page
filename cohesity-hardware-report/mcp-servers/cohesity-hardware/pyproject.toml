[project]
name = "cohesity-hardware-mcp"
version = "0.1.0"
description = "Read-only (GET-only) MCP server exposing Cohesity/Helios cluster hardware inventory (nodes, chassis, racks, disks, IPMI) as tools."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
]

[project.scripts]
cohesity-hardware-mcp = "cohesity_hardware_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
